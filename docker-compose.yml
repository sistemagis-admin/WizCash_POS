services:
  postgres:
    image: postgres:16-alpine
    container_name: wizcash_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-wizcash_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wizcash_password}
      POSTGRES_DB: ${DB_NAME:-wizcash_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wizcash_user} -d ${DB_NAME:-wizcash_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wizcash_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wizcash.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
